# PostgreSQL primary (запись + чтение) и replica (только чтение, копия primary)
services:
  primary:
    image: postgres:16
    container_name: pg-primary
    environment:
      POSTGRES_USER: dw
      POSTGRES_PASSWORD: dwpass
      POSTGRES_DB: cve_db
      REPL_PASSWORD: replpass          
    ports:
      - "5432:5432"
    volumes:
      - primary_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U dw -d cve_db"]
      interval: 3s
      timeout: 3s
      retries: 20

  replica:
    image: postgres:16
    container_name: pg-replica
    user: postgres
    depends_on:
      primary:
        condition: service_healthy
    environment:
      PGPASSWORD: replpass             
    ports:
      - "5433:5432"
    volumes:
      - replica_data:/var/lib/postgresql/data
    command:
      - bash
      - -c
      - |
        if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
          echo "Copying data from primary..."
          pg_basebackup -h primary -U replicator -D /var/lib/postgresql/data -Fp -Xs -R -P
        fi
        chmod 700 /var/lib/postgresql/data
        exec postgres

volumes:
  primary_data:
  replica_data: